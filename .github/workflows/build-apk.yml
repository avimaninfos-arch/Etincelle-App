name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up NodeJS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Clean Application Container
        run: |
          cordova create etincelle_app com.aviman.etincelle Etincelle
          cd etincelle_app
          cordova platform add android --no-telemetry
          echo '{"url": "https://perchance.org", "clearCache": true}' > www/manifest.json
          echo '<widget id="com.aviman.etincelle" version="1.0.0" xmlns="http://w3.org"><name>Etincelle</name><content src="https://perchance.org#" /><preference name="FullScreen" value="true" /><preference name="Orientation" value="default" /></widget>' > config.xml

      - name: Compile Lightweight Android Package
        run: |
          cd etincelle_app
          cordova build android --device --release

      - name: Upload Clean APK Product
        uses: actions/upload-artifact@v4
        with:
          name: Etincelle-APK
          path: etincelle_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
